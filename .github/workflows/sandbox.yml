name: Probar sandbox

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Argentina/Buenos_Aires
      SBX_AU: ${{ secrets.PPI_SANDBOX_AUTHORIZED_CLIENT }}
      SBX_CL: ${{ secrets.PPI_SANDBOX_CLIENT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Probar
        run: python probar_sandbox.py
# FIN sandbox.yml
