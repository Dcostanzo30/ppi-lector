name: Explorar PPI

on:
  workflow_dispatch:

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Argentina/Buenos_Aires
      PPI_API_KEY: ${{ secrets.PPI_API_KEY }}
      PPI_API_SECRET: ${{ secrets.PPI_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ppi-client
      - name: Explorar
        run: python explorar_ppi.py
