name: Probar Supabase

on:
  schedule:
    - cron: "17 15 * * 6"     # sábados 12:17 de Buenos Aires: borra lo de más de una semana (sin mercado)
  workflow_dispatch:
    inputs:
      purgar:
        description: "si = borrar las filas de más de una semana (la cinta original queda en GitHub y Hugging Face)"
        default: "no"
      probar:
        description: "si = además guardar, leer y borrar una operación de prueba"
        default: "no"

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
    steps:
      - run: pip install requests
      - name: Medir la tabla ops (solo lectura)
        shell: python
        run: |
          import os, requests
          from datetime import date, timedelta
          url = os.environ["SUPABASE_URL"].strip().rstrip("/"); k = os.environ["SUPABASE_SECRET"].strip()
          h = {"apikey": k}
          if k.startswith("eyJ"): h["Authorization"] = "Bearer " + k
          def cuenta(filtro=""):
              r = requests.get(f"{url}/rest/v1/ops?select=clave{filtro}", headers=dict(h, Prefer="count=exact", Range="0-0"), timeout=60)
              return int(r.headers.get("Content-Range", "*/0").split("/")[-1] or 0)
          def extremo(orden):
              r = requests.get(f"{url}/rest/v1/ops?select=fecha&order=fecha.{orden}&limit=1", headers=h, timeout=60)
              return r.json()[0]["fecha"] if r.ok and r.json() else None
          total = cuenta(); d0, d1 = extremo("asc"), extremo("desc")
          print(f"Filas totales: {total:,} · primera fecha {d0} · última fecha {d1}")
          if d0 and d1:
              d = date.fromisoformat(d0)
              while d <= date.fromisoformat(d1):
                  if d.weekday() < 5:
                      n = cuenta(f"&fecha=eq.{d}")
                      if n: print(f"  {d}: {n:,} filas")
                  d += timedelta(days=1)
              hace7 = date.today() - timedelta(days=7)
              print(f"Filas de más de una semana (fecha < {hace7}): {cuenta(f'&fecha=lt.{hace7}'):,}")
          print("Plan gratuito de Supabase: 500 MB de base. A unos 200 a 300 bytes por fila con índices, estimado:",
                f"{total * 250 / 2**20:,.0f} MB")
      - name: Borrar filas de más de una semana
        if: ${{ github.event_name == 'schedule' || github.event.inputs.purgar == 'si' }}
        shell: python
        run: |
          import os, requests
          from datetime import date, timedelta
          url = os.environ["SUPABASE_URL"].strip().rstrip("/"); k = os.environ["SUPABASE_SECRET"].strip()
          h = {"apikey": k, "Prefer": "return=minimal"}
          if k.startswith("eyJ"): h["Authorization"] = "Bearer " + k
          corte = date.today() - timedelta(days=7)
          r = requests.get(f"{url}/rest/v1/ops?select=fecha&order=fecha.asc&limit=1", headers=h, timeout=60)
          d = date.fromisoformat(r.json()[0]["fecha"]) if r.ok and r.json() else corte
          while d < corte:                                      # de a un día, para no pasar el tiempo máximo de la base
              r = requests.delete(f"{url}/rest/v1/ops?fecha=eq.{d}", headers=h, timeout=300)
              print(f"  {d}: {r.status_code}", "borrado" if r.status_code < 300 else r.text[:200], flush=True)
              d += timedelta(days=1)
          r = requests.get(f"{url}/rest/v1/ops?select=clave", headers=dict(h, Prefer="count=exact", Range="0-0"), timeout=60)
          print("Filas que quedan:", r.headers.get("Content-Range", "?").split("/")[-1])
      - name: Probar
        if: ${{ github.event.inputs.probar == 'si' }}
        shell: python
        run: |
          import os, json, requests
          url = os.environ["SUPABASE_URL"].strip().rstrip("/")
          k = os.environ["SUPABASE_SECRET"].strip()
          print("Dirección:", url if url.startswith("https://") and url.endswith(".supabase.co") else "MAL CARGADA (tiene que ser https://....supabase.co)")
          print("Clave secreta:", "tipo sb_secret" if k.startswith("sb_secret_") else "tipo service_role" if k.startswith("eyJ") else "NO PARECE la clave secreta")
          h = {"apikey": k, "Content-Type": "application/json"}
          if k.startswith("eyJ"):
              h["Authorization"] = "Bearer " + k
          fila = {"clave": "PRUEBA|1", "fecha": "2026-10-20", "ts": "2026-10-20T19:30:00.000", "tk": "PRUEBA",
                  "precio": 1, "nom": 1, "monto": 1, "lado": "C"}
          r = requests.post(url + "/rest/v1/ops?on_conflict=clave", headers=dict(h, Prefer="resolution=ignore-duplicates,return=minimal"), data=json.dumps([fila]), timeout=20)
          print("1) Guardar una operación de prueba:", r.status_code, "OK" if r.status_code < 300 else r.text[:200])
          r = requests.get(url + "/rest/v1/ops?clave=eq.PRUEBA%7C1&select=tk,precio", headers=h, timeout=20)
          print("2) Leerla de vuelta:", r.status_code, r.text[:200])
          r = requests.post(url + "/realtime/v1/api/broadcast", headers=h, timeout=20,
                            data=json.dumps({"messages": [{"topic": "cinta", "event": "ops", "payload": {"ops": [], "libro": {}}}]}))
          print("3) Aviso en vivo:", r.status_code, "OK" if r.status_code < 300 else r.text[:200])
          r = requests.delete(url + "/rest/v1/ops?clave=eq.PRUEBA%7C1", headers=h, timeout=20)
          print("4) Borrar la prueba:", r.status_code, "OK" if r.status_code < 300 else r.text[:200])
# FIN supabase.yml
