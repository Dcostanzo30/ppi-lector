name: Canal de salida (datos diarios)

on:
  workflow_dispatch:
  schedule:
    - cron: "40 22 * * 1-5"

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - run: python canal_salida_datos.py
      - name: Guardar
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add estudios/historico/dolares_diarios.csv estudios/historico/riesgo_pais.csv
          git commit -m "Dólares diarios y riesgo país" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
