name: Semaforo (precios diarios)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PPI_API_KEY: ${{ secrets.PPI_API_KEY }}
      PPI_API_SECRET: ${{ secrets.PPI_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ppi-client pandas
      - run: python semaforo_datos.py
      - name: Guardar
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add estudios/historico/semaforo_precios.csv
          git commit -m "Semáforo: precios diarios" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
