name: Historial bonos

# Historial diario de los soberanos AL y GD en pesos y en dólares MEP (D) para comparar su comportamiento.
# Solo consultas. No corre en horario de rueda.
on:
  push:
    paths:
      - ".github/workflows/historial_bonos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Argentina/Buenos_Aires
      PPI_API_KEY: ${{ secrets.PPI_API_KEY }}
      PPI_API_SECRET: ${{ secrets.PPI_API_SECRET }}
      HIST_TIPO: BONOS
      HIST_ACCIONES: AL29,AL29D,AL30,AL30D,AL35,AL35D,AE38,AE38D,AL41,AL41D,GD29,GD29D,GD30,GD30D,GD35,GD35D,GD38,GD38D,GD41,GD41D,GD46,GD46D
      HIST_NY: ""
      HIST_SALIDA: estudios/bonos
      HIST_SOLO24: "1"
    steps:
      - name: Fuera del horario de rueda
        run: |
          D=$(date +%u); H=$(date +%H)
          if [ "$D" -le 5 ] && [ "$H" -ge 9 ] && [ "$H" -lt 18 ]; then echo "Horario de rueda: no corre"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ppi-client
      - name: Bajar
        run: python cedear_estudio.py 2026-07-01
      - name: Guardar
        run: |
          git config user.name "bot-mercado"
          git config user.email "bot@users.noreply.github.com"
          git add estudios
          git diff --cached --quiet && { echo "Nada nuevo"; exit 0; }
          git commit -m "Historial bonos $(date +%F)"
          for i in 1 2 3; do git push && break || (git pull --rebase && sleep 5); done
# FIN historial_bonos.yml
